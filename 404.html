<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070a0f">

    <title>404 — Lost in the sky | ZeSoftware</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 32px;

            color: #f2eee4;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(35, 55, 80, .28),
                    transparent 35rem
                ),
                #070a0f;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            max-width: 700px;
            text-align: center;
        }

        .star {
            color: #f1cf7c;
            font-size: 3rem;
        }

        h1 {
            margin: 20px 0 8px;

            color: #f1cf7c;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(5rem, 16vw, 10rem);
            font-weight: 400;
            line-height: .9;
        }

        h2 {
            margin: 20px 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 400;
        }

        p {
            color: #b8bcc2;
        }

        a {
            display: inline-block;

            margin-top: 25px;
            padding: 13px 20px;

            color: #15120b;
            background: #f1cf7c;

            border-radius: 6px;

            font-weight: 700;
            text-decoration: none;
        }

        small {
            display: block;
            margin-top: 35px;

            color: #6f7781;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-style: italic;
        }
    </style>
</head>

<body>

<main>

    <div class="star">✦</div>

    <h1>404</h1>

    <h2>This part of the sky is not mapped.</h2>

    <p>
        The coordinates may be wrong, the target may have moved,
        or someone selected an exceptionally uncooperative reference frame.
    </p>

    <a href="/zeastrosoft/">
        Return to ZeSoftware
    </a>

    <small>
        Even butter knives occasionally miss the target.
    </small>

</main>

</body>
</html>
